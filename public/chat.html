<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatVerse</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>💬 ChatVerse</h1>
      <a href="index.html" class="btn leave">Leave</a>
    </header>
    <main class="chat-main">
      <div class="chat-sidebar">
        <h3>Room:</h3>
        <h2 id="room-name"></h2>
        <h3>Online Users</h3>
        <ul id="users"></ul>
      </div>
      <div class="chat-messages" id="messages"></div>
    </main>
    <div class="chat-form-container">
      <form id="chat-form">
        <input id="msg" type="text" placeholder="Type a message..." required autocomplete="off" />
        <button class="btn send">Send</button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.11.1/qs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
